<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App with Local Storage</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, pink, cyan);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #todo {
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }

        input {
            width: 68%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #555;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin-left: 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .todo-item {
            border: 2px solid #eee;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
        }

        .completed {
            background-color: #d4edda;
            text-decoration: line-through;
        }
    </style>
</head>

<body>

<div id="todo"></div>

<script>
(function () {

  
    let todos = JSON.parse(localStorage.getItem("todos")) || [];

    const todocontainer = document.getElementById("todo");

    const inputtask = document.createElement("input");
    inputtask.type = "text";
    inputtask.placeholder = "Enter task...";

    const addbtn = document.createElement("button");
    addbtn.textContent = "Add";

    const todolist = document.createElement("div");

    todocontainer.append(inputtask, addbtn, todolist);
  
    function saveTodos() {
        localStorage.setItem("todos", JSON.stringify(todos));
    }

  
    function renderTask(todo, index) {

        const todoitem = document.createElement("div");
        todoitem.className = "todo-item";

        if (todo.completed) {
            todoitem.classList.add("completed");
        }

        const p = document.createElement("p");
        p.textContent = todo.text;

        const deletebtn = document.createElement("button");
        deletebtn.textContent = "Delete";

        const editbtn = document.createElement("button");
        editbtn.textContent = "Edit";

        const completebtn = document.createElement("button");
        completebtn.textContent = "Complete";

        completebtn.addEventListener("click", function () {
            todo.completed = !todo.completed;
            todoitem.classList.toggle("completed");
            saveTodos();
        });
      
        let isEditing = false;

        editbtn.addEventListener("click", function () {

            if (isEditing) return;
            isEditing = true;

            const editinput = document.createElement("input");
            editinput.value = todo.text;

            const savebtn = document.createElement("button");
            savebtn.textContent = "Save";

            todoitem.prepend(editinput, savebtn);
            editinput.focus();

            savebtn.addEventListener("click", function () {

                const updatedTask = editinput.value.trim();

                if (!updatedTask) return;

                todo.text = updatedTask;
                p.textContent = updatedTask;

                saveTodos();

                editinput.remove();
                savebtn.remove();

                isEditing = false;
            });

        });

  
        deletebtn.addEventListener("click", function () {

            todos.splice(index, 1);

            saveTodos();

            renderAll();

        });

        todoitem.append(p, deletebtn, editbtn, completebtn);

        todolist.append(todoitem);

    }

  
    function renderAll() {

        todolist.innerHTML = "";

        todos.forEach(function (todo, index) {
            renderTask(todo, index);
        });

    }

    // Add task
    function addTodo() {

        const task = inputtask.value.trim();

        if (!task) return;

        todos.unshift({
            text: task,
            completed: false
        });

        saveTodos();

        renderAll();

        inputtask.value = "";
        inputtask.focus();

    }

    addbtn.addEventListener("click", addTodo);

    inputtask.addEventListener("keydown", function (e) {

        if (e.key === "Enter") {
            addTodo();
        }

    });

  
    renderAll();

})();
</script>

</body>
</html>
